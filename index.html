<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>QuickBridge｜跨裝置傳檔</title>
  <link rel="stylesheet" href="style.css?v=studio1">
  <style>
    .choices.mode-picker{grid-template-columns:1fr}
    .direct-option{padding:8px 2px}
    .direct-option p{margin:12px 0}
    #switchRelay{margin-bottom:16px}
    main:has(#transfer:not([hidden])) #switchRelay{display:none}
  </style>
</head>
<body>
<main>
  <header class="mast"><span class="mark" aria-hidden="true">⇄</span><strong>QuickBridge</strong></header>
  <section id="setup">
    <div class="intro">
      <div><h1>跨裝置傳檔<span>。</span></h1><p>在這台裝置建立房間，用另一台掃碼加入。</p></div>
      <div class="devices" aria-hidden="true"><i class="laptop"></i><b>⇄</b><i class="phone"></i></div>
    </div>
    <div class="choices mode-picker">
      <article class="choice primary"><h2>小檔中繼</h2><p>手機用 5G 也能傳。透過 HTTPS 傳送文字、照片或單檔 5 MB 以內的檔案。</p><button id="createRelay">建立 HTTPS 小檔中繼房間 <span aria-hidden="true">↗</span></button></article>
      <details class="direct-option"><summary>其他傳輸方式 · 點對點直連</summary><p>僅限兩端可建立 WebRTC 直連時使用，單檔上限 20 MB。</p><button class="secondary" id="create">嘗試建立直連房間</button></details>
    </div>
  </section>
  <section id="room" class="panel" hidden>
    <div class="row"><h2>傳輸房間</h2><button id="leave" class="quiet">結束房間</button></div>
    <p id="status" role="status">連線中…</p>
    <button id="switchRelay" class="secondary" hidden>改建 HTTPS 小檔中繼房間</button>
    <div class="invitation"><div id="qr"></div>
      <div class="invite-actions"><button id="copyInvite" class="secondary">複製邀請連結</button>
        <details><summary>顯示完整連結</summary><a id="invite" target="_blank" rel="noopener noreferrer"></a></details>
        <small id="copyResult" role="status"></small>
      </div>
    </div>
    <p id="sas" hidden></p><button id="confirm" hidden>確認配對碼相同</button> <button id="reject" class="secondary" hidden>拒絕配對</button>
  </section>
  <section id="transfer" hidden>
    <div class="choices">
      <article class="panel"><h2><label for="file">傳送檔案</label></h2><input id="file" type="file"><button id="sendFile">傳送檔案</button><progress id="progress" aria-label="檔案送出進度" max="100" value="0"></progress></article>
      <article class="panel"><h2><label for="text">傳送文字</label></h2><textarea id="text" placeholder="輸入文字或貼上網址"></textarea><button id="sendText" class="secondary">傳送文字</button></article>
    </div>
    <article class="panel inbox"><h2>接收內容</h2><div id="received" aria-live="polite"></div></article>
  </section>
  <footer>HTTPS 中繼會暫存加密資料，供另一端取回。請只與接收者分享房間連結。</footer>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script><script src="app.js?v=https-relay1"></script>
<script>
const switchRelay = document.getElementById('switchRelay');
document.getElementById('create').addEventListener('click', () => { switchRelay.hidden = false; });
for (const id of ['leave', 'createRelay']) {
  document.getElementById(id).addEventListener('click', () => { switchRelay.hidden = true; });
}
switchRelay.onclick = () => {
  document.getElementById('leave').click();
  document.getElementById('createRelay').click();
};
const copyResult = document.getElementById('copyResult');
document.getElementById('copyInvite').onclick = async () => {
  const invite = document.getElementById('invite');
  try {
    await navigator.clipboard.writeText(invite.href);
    copyResult.textContent = '已複製，可以傳給另一台裝置。';
  } catch {
    invite.closest('details').open = true;
    copyResult.textContent = '請長按或選取連結複製。';
  }
};
document.getElementById('leave').addEventListener('click', () => { copyResult.textContent = ''; });
</script>
</body></html>
