<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickBridge｜跨裝置傳檔</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>QuickBridge</h1><p>免安裝・掃碼配對・跨網路傳檔</p></header><section id="setup"><button id="create">建立直連房間</button> <button id="createRelay">建立小檔中繼房間（5 MB）</button><p>或在另一台裝置開啟分享連結</p></section><section id="room" hidden><p id="status" role="status">連線中…</p><div id="qr"></div><p><a id="invite" target="_blank" rel="noopener"></a></p><p id="sas" hidden></p><button id="confirm" hidden>確認配對碼相同</button><button id="reject" hidden>拒絕配對</button><button id="leave">結束房間</button></section><section id="transfer" hidden><h2>傳送文字</h2><textarea id="text" placeholder="輸入文字或網址"></textarea><button id="sendText">傳送文字</button><h2>傳送檔案</h2><input id="file" type="file"><button id="sendFile">傳送檔案</button><progress id="progress" max="100" value="0"></progress><h2>接收內容</h2><div id="received"></div></section><footer>中繼模式會轉送加密資料，不會儲存檔案。請勿在公用電腦傳送機密資料。</footer></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="config.js"></script><script src="app.js?v=relay1"></script></body></html>
